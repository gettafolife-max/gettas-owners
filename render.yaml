services:
  - type: web
    name: gettas-owners
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: gettas-owners-db
          property: connectionString

      - key: ADMIN_EMAIL
        value: admin@gettas.ge

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gettas-owners-db
    databaseName: gettas_owners
    user: gettas_owners
    plan: free
